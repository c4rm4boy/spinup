<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- SpinUp project home page (Tai Nguyen, 2026). One page per idea once "Put your Staff to work" runs: your Staff as agents,
     today's tasks (yours vs theirs), each Pro's first deliverable, a timeline, decisions and what the Staff knows.
     Data: ?demo=<slug> reads data.js (static demo); ?p=<project> fetches /project-data from the SpinUp helper. -->
<style>
/* A home page for one idea: summary tiles up top, then a section per tile. Dark by default. */
:root {
  --bg:#0e1522; --surface:#162033; --surface-2:#1c2840; --ink:#e8edf6; --ink-2:#b8c3d6; --muted:#8a97ad; --line:#2a3752; --focus:#7aa5ff;
  --accent:#3fd1c7; --lead:#f2c94c; --good:#6fd38c; --you:#7aa5ff;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif; --f-body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--f-body); }
.wrap { max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:24px 56px; display:grid; gap:22px; }
button { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:5px 12px; cursor:pointer; }
button:hover { border-color:var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
a { color:var(--focus); }
.eyebrow { margin:0; font:700 13px var(--f-display); letter-spacing:.14em; text-transform:uppercase; color:var(--lead); }
.eyebrow span { color:var(--muted); }
h1 { margin:4px 0 0; font:750 clamp(28px,5vw,42px)/1.08 var(--f-display); text-wrap:balance; }
.one { margin:6px 0 0; color:var(--ink-2); font-size:18px; max-width:70ch; }
.meta { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-top:10px; color:var(--muted); font-size:14px; }
.pill { display:inline-flex; gap:6px; align-items:center; padding:3px 10px; border-radius:999px; background:color-mix(in srgb, var(--good) 16%, transparent); color:var(--good); font:650 13px var(--f-display); }
.pill::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 8px var(--good); }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr)); gap:10px; }
.tile { display:grid; gap:2px; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:12px; padding:12px 14px; }
.tile:hover { border-color:var(--c); }
.tile b { font:700 26px/1.1 var(--f-display); font-variant-numeric:tabular-nums; }
.tile span { color:var(--ink-2); font-size:14px; }
section { display:grid; gap:12px; scroll-margin-top:12px; }
/* Grid items default to min-width:auto, which lets the wide timeline push the whole page sideways on a phone. */
.wrap > *, section > *, .grid > *, .cols > * { min-width:0; }
.agent .ti, .deliv h3, .todo .t { overflow-wrap:anywhere; }
h2 { margin:0; font:700 21px var(--f-display); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
h2 small { font:400 14px var(--f-body); color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr)); gap:12px; align-items:start; }
.agent { background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:12px; padding:12px 14px; display:grid; gap:8px; }
.agent .top { display:grid; grid-template-columns:40px 1fr auto; gap:10px; align-items:center; }
.agent .av { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-size:21px; background:var(--surface-2); border:2px solid var(--c); }
.agent .nm { font:650 16px/1.2 var(--f-display); }
.agent .ti { color:var(--ink-2); font-size:13.5px; }
.badge { font:700 11px var(--f-display); letter-spacing:.08em; padding:3px 8px; border-radius:999px; color:#06231f; background:var(--accent); }
.status { font-size:14.5px; }
.status b { color:var(--accent); }
.agent dl { margin:0; display:grid; gap:6px; font-size:14px; }
.agent dt { font:650 12.5px var(--f-display); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.agent dd { margin:0; color:var(--ink-2); }
.agent dd ul { margin:2px 0 0; padding-left:18px; }
details > summary { cursor:pointer; color:var(--ink-2); font-size:14px; }
.cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:12px; }
.box { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:8px; align-content:start; }
.box h3 { margin:0; font:650 16.5px var(--f-display); }
.todo { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.todo li { display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:start; padding:6px 8px; border-radius:8px; background:var(--surface-2); }
.todo input { width:18px; height:18px; margin-top:2px; accent-color:var(--accent); }
.todo li.done span.t { text-decoration:line-through; color:var(--muted); }
/* The Staff's finished work isn't crossed out; it's delivered. */
.todo li.delivered > span:first-child { color:var(--good); font-weight:700; }
.todo li.delivered .when { color:var(--good); }
.todo .when { color:var(--muted); font-size:13px; white-space:nowrap; }
.todo .who { font-size:13px; color:var(--c); font-weight:650; }
.deliv { background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:12px; padding:12px 14px; display:grid; gap:8px; align-content:start; }
.deliv .hd { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.deliv .kind { font:700 11px var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.deliv h3 { margin:0; font:650 17px var(--f-display); }
.deliv .sum { margin:0; color:var(--ink-2); font-size:14.5px; }
.md { font-size:14.5px; border-top:1px solid var(--line); padding-top:8px; }
.md h4 { margin:10px 0 4px; font:650 15px var(--f-display); }
.md p { margin:6px 0; } .md ul { margin:4px 0; padding-left:20px; }
.md table { border-collapse:collapse; font-size:13.5px; margin:6px 0; } .md td, .md th { border-bottom:1px solid var(--line); padding:4px 10px 4px 0; text-align:left; }
.tablewrap { overflow-x:auto; }
.gantt { display:grid; gap:6px; overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.grow { display:grid; grid-template-columns:200px 1fr; gap:10px; align-items:center; min-width:640px; }
.grow .lbl { font-size:14px; } .grow .lbl small { display:block; color:var(--muted); font-size:12.5px; }
.track { position:relative; height:24px; background:repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / var(--w) - 1px), var(--line) calc(100% / var(--w) - 1px), var(--line) calc(100% / var(--w))); border-radius:6px; }
.bar { position:absolute; top:3px; bottom:3px; border-radius:6px; background:var(--c); opacity:.9; }
.axis { color:var(--muted); font-size:12.5px; }
.facts { display:flex; flex-wrap:wrap; gap:6px; }
.facts span { font-size:14px; padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); }
.decisions { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.decisions li { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
.decisions li span { color:var(--ink-2); font-size:14.5px; }
.grew { color:var(--ink-2); font-size:14.5px; }
.guard { border:1px dashed var(--good); border-radius:12px; padding:10px 14px; color:var(--ink-2); font-size:14.5px; }
.guard b { color:var(--good); }
.foot { color:var(--muted); font-size:13.5px; margin:0; }
.empty { color:var(--muted); }
/* Talk to your Staff: a chat drawer with a tab per Pro, each tab a real Claude Code session (needs the SpinUp helper). */
.talk { justify-self:start; font-size:14px; }
.agent .talk { margin-top:2px; }
#chat { position:fixed; top:0; right:0; bottom:0; z-index:20; display:grid; background:var(--surface); border-left:1px solid var(--line); box-shadow:-12px 0 32px rgba(0,0,0,.35); padding-top:env(safe-area-inset-top,0px); }
#chat[hidden] { display:none; }
/* Real people (step 13a) and the timeline review */
.realbar { display:flex; gap:8px; flex-wrap:wrap; }
.agent.real { border-left-style:solid; }
.badge.real { background:#e8916b; color:#2a1206; }
.contact { font-size:14px; color:var(--ink-2); } .private { font-size:11.5px; color:var(--muted); }
.hlog { margin:4px 0 0; padding-left:18px; font-size:13.5px; color:var(--ink-2); }
.hact { display:flex; gap:6px; flex-wrap:wrap; } .hact button { font-size:13px; padding:3px 9px; } .hact .del, .hconfirm .del { color:#ff8a7a; }
.hconfirm, .hlogform { display:grid; gap:6px; font-size:13.5px; border-top:1px dashed var(--line); padding-top:8px; }
.hlogform input, .hlogform select, .hform input, .hform select, .hform textarea { font:inherit; font-size:14px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:6px 8px; width:100%; }
.hform { display:grid; gap:10px; max-width:640px; } .hform label { display:grid; gap:3px; font-size:13px; color:var(--ink-2); }
.fgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap:10px; }
.hform .row, .tlr .row, .hlogform .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .hform .err { color:#ff8a7a; font-size:13.5px; }
button.primary { background:var(--accent); color:#06231f; border-color:var(--accent); font-weight:650; }
.needs { display:grid; gap:6px; background:var(--surface); border:1px dashed #e8916b; border-radius:12px; padding:10px 12px; font-size:14px; }
.need { display:flex; gap:10px; align-items:center; justify-content:space-between; } .need i { color:var(--muted); }
.tlr { display:grid; gap:8px; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--lead); border-radius:12px; padding:12px 14px; font-size:14.5px; }
.tlr ul { margin:0; padding-left:18px; } .tlr .err { color:#ff8a7a; }
.tlbtn { margin-left:auto; font:inherit; font-size:13.5px; }
.sched { margin:6px 0 0; color:var(--ink-2); font-size:15px; } .sched b { color:var(--lead); }
/* 🧠 Project memory and handoffs (Tai, 11-08) */
.facts .mem { border-color:color-mix(in srgb, #ff9f5a 45%, var(--line)); }
.facts .mem small { color:var(--ink-2); margin-left:2px; }
.memx { background:none; border:0; padding:0 0 0 6px; color:var(--ink-2); cursor:pointer; font-size:12px; }
.memx:hover { color:var(--bad); }
li.hand small { color:var(--ink-2); }
.todo .added { display:block; font-size:12.5px; color:var(--ink-2); }
.deliv .dstate { margin:0; font-size:13px; color:var(--ink-2); } .deliv .dstate b { color:var(--ink); }
.deliv details.orig { margin-top:8px; } .deliv .redo { justify-self:start; margin-top:4px; }
.ticked { display:grid; gap:4px; margin-top:6px; font-size:13.5px; color:var(--good); } .ticked s { color:var(--ink-2); }
/* 🗂️ Project data (Tai, 11-08) */
#data .dtabs { display:flex; gap:6px; flex-wrap:wrap; }
#data .dtabs button { font:inherit; font-size:14px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer; }
#data .dtabs button[aria-selected="true"] { border-color:#f2b84b; color:var(--ink); background:color-mix(in srgb, #f2b84b 16%, var(--surface)); }
#data .dbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:14px; color:var(--ink-2); }
#data .dbar input { flex:1 1 200px; font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2, var(--surface)); color:var(--ink); }
#data .dbar button, #data .dbar .btn { font:inherit; font-size:14px; padding:5px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none; }
#data .dbar button[aria-pressed="true"] { border-color:#f2b84b; }
#data .dgrid { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
#data table { width:100%; border-collapse:collapse; font-size:14px; }
#data th, #data td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
#data th button { font:inherit; font-weight:650; background:none; border:0; color:var(--ink); cursor:pointer; padding:0; white-space:nowrap; }
#data td.t-money, #data td.t-number { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
#data td.t-date { white-space:nowrap; }
#data tfoot td { border-bottom:0; }
#data .board { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(200px, 1fr); gap:10px; overflow-x:auto; padding-bottom:4px; }
#data .lane { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px; display:grid; gap:8px; align-content:start; }
#data .lane h4 { margin:0; font-size:14px; } #data .lane h4 small { color:var(--ink-2); font-weight:400; }
#data .card { background:var(--surface-2, var(--bg)); border:1px solid var(--line); border-radius:10px; padding:8px; display:grid; gap:3px; font-size:13.5px; }
#data .card small { color:var(--ink-2); } #data .card select { font:inherit; font-size:13px; margin-top:4px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:6px; }
#data .dhist { list-style:none; margin:0; padding:0; display:grid; gap:6px; font-size:13.5px; max-height:320px; overflow:auto; }
#data .dhist li.undone { opacity:.55; } #data .dhist .hwhen { color:var(--ink-2); }
#data .dnote { margin:0; font-size:13.5px; color:var(--ink-2); }
#data .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
/* 🔊 read aloud and ✏️ rename (Tai, 11-02) */
.say { font-size:13px; min-height:28px; padding:2px 10px; }
.say.on { border-color:var(--accent); color:var(--accent); }
.say.mini { display:block; margin:6px 0 0 auto; padding:1px 8px; font-size:12.5px; background:transparent; }
.hdb { display:flex; gap:6px; align-items:center; }
.ren { background:none; border:0; padding:0 4px; font-size:13px; cursor:pointer; opacity:.6; }
.ren:hover, .ren:focus-visible { opacity:1; }
.renbox { display:inline-flex; flex-wrap:wrap; gap:4px; align-items:center; margin-left:4px; }
.renbox input { font:inherit; font-size:14px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:2px 6px; width:11em; }
.renbox button { font-size:13px; padding:2px 8px; }
.renbox .err { color:#ff8a7a; font-size:12.5px; }
/* Video highlight: the Talk buttons and the chat panel glow so viewers see they can keep talking to each Pro. */
.talk.hl { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 22%, var(--surface)); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent); }
#chat.hl { border-left:2px solid var(--accent); box-shadow:-12px 0 32px rgba(0,0,0,.35), inset 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
#chat .chd { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
#chat .chd b { flex:1; font:650 16px var(--f-display); }
/* Every Pro's tab stays in view: wrap to a second row instead of scrolling off the edge (Tai, 11-03). */
#chat .tabs { display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); }
#chat .tabs button { white-space:nowrap; border-radius:999px; padding:4px 10px; font-size:13.5px; }
#chat .tabs button[aria-selected="true"] { border-color:var(--c); background:color-mix(in srgb, var(--c) 18%, var(--surface)); }
#chat .msgs { overflow-y:auto; padding:12px 14px; display:grid; gap:10px; align-content:start; }
#chat .m { max-width:88%; padding:8px 12px; border-radius:14px; font-size:15px; }
#chat .m.you { justify-self:end; background:#24407a; border-radius:14px 4px 14px 14px; white-space:pre-wrap; }
#chat .m.pro { justify-self:start; background:var(--surface-2); border-left:3px solid var(--c); border-radius:4px 14px 14px 14px; }
#chat .m.pro p { margin:4px 0; } #chat .m.pro ul { margin:4px 0; padding-left:20px; }
#chat .m.err { justify-self:center; color:#ff9f8a; font-size:14px; background:none; }
#chat .act { margin-top:8px; padding:8px 10px; border:1px dashed var(--c); border-radius:10px; background:var(--bg); }
#chat .act ul { margin:4px 0 8px; padding-left:20px; }
#chat .act .actbtns { display:inline-flex; gap:6px; }
#chat .act .actdone { color:var(--muted); font-size:13.5px; }
#chat .act .err { display:block; color:#ff8a7a; font-size:12.5px; }
#chat .act .clash, .renbox .clash { color:#f2c94c; font-size:13px; }
/* Google for this project (Tai, 11-03): a G badge like Chief's ✈️; gray when off. */
.gbadge { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:3px 10px 3px 4px; font-size:13.5px; }
.gbadge .g { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; font:700 14px/1 var(--f-display, sans-serif);
             background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
.gbadge.on { border-color:#4285f4; }
.gbadge.on .g { background:#fff; color:#4285f4; border-color:#4285f4; }
.gpanel { margin-top:10px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); display:grid; gap:8px; max-width:640px; }
.gpanel[hidden] { display:none; }
.gpanel .gwho { display:flex; flex-wrap:wrap; gap:6px 14px; }
.gpanel label { display:inline-flex; gap:6px; align-items:center; }
.gpanel .note { color:var(--muted); font-size:13px; }
.gpanel .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
#chat .wait { color:var(--muted); font-size:14px; }
#chat .files { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 6px; }
#chat .files button { font-size:13px; padding:3px 9px; }
#chat form { display:grid; grid-template-columns:auto 1fr auto; gap:8px; padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); }
#chat textarea { font:inherit; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; resize:none; min-height:44px; max-height:140px; }
#chat .hint { grid-column:1/-1; color:var(--muted); font-size:12.5px; }
/* 📎 Attachments (Tai, 11-07): paste, drop or pick images and PDFs for a Pro. */
#chat .clip { align-self:stretch; padding:0 10px; font-size:18px; }
#chat .atts { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; } #chat .atts:empty { display:none; }
.att { position:relative; display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:4px 26px 4px 4px; font-size:12.5px; max-width:220px; }
.att img { width:44px; height:44px; object-fit:cover; border-radius:6px; } .att .pdfi { font-size:26px; width:44px; text-align:center; }
.att span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .att.up { opacity:.6; }
.att button { position:absolute; top:2px; right:2px; padding:0 6px; border:0; background:transparent; font-size:13px; }
.mfiles { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; justify-content:flex-end; }
.mfiles button { padding:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface-2); }
.mfiles img { display:block; width:120px; height:90px; object-fit:cover; } .mfiles .pdfb { padding:8px 10px; font-size:13px; }
#chat.dropping .cmain { outline:2px dashed var(--accent); outline-offset:-6px; }
/* Staff panel (Tai, 11-07): Pros on the left with their folders and files below; a file opens in a third panel beside
   the chat. ↗ opens the whole thing in its own tab (&view=staff). Narrow screens: ☰ slides the panel in, a file covers the chat. */
#chat { width:min(820px,100vw); grid-template-rows:auto 1fr; }
#chat.viewing { width:min(1320px,100vw); }
#chat .chd .ib { padding:3px 9px; font-size:14px; }
#chat .chd .side-t { display:none; }
#chat .cbody { display:grid; grid-template-columns:230px minmax(0,1fr); min-height:0; position:relative; }
#chat.viewing .cbody { grid-template-columns:230px minmax(300px,1fr) minmax(320px,1.15fr); }
#chat .side { border-right:1px solid var(--line); overflow-y:auto; min-height:0; display:flex; flex-direction:column; background:var(--surface); }

  app.addEventListener('change', function (e) { var s = e.target.closest('[data-gself]'); if (s) s.closest('.gcheck').querySelector('[data-gselfsave]').disabled = !s.checked; });
  app.addEventListener('click', function (e) {
    if (e.target.id === 'gAck') { e.target.disabled = true; gpost('/guard/ack', {}).then(function () { location.reload(); }); return; }
    var g = e.target.closest('.gcheck'); if (!g) return;
    var r = e.target.closest('[data-rev]'); if (r) { g.querySelector('input[type=text]').value = r.dataset.rev; return; }
    if (e.target.closest('[data-gcancel]')) { g.remove(); return; }
    var self = !!e.target.closest('[data-gselfsave]'), save = e.target.closest('[data-gsave]'); if (!self && !save) return;
    var who = g.querySelector('input[type=text]').value.trim(); if (save && !who) { g.querySelector('.clash').textContent = 'Type who checked it.'; return; }
    gpost('/guard/check', { item: g.dataset.item, self: self, reviewer: self ? '' : who }).then(function (G) {
      if (G.error) { g.querySelector('.clash').textContent = G.error; return; }
      GUARD = G; doneMap[g.dataset.item] = true; try { localStorage.setItem(storeKey, JSON.stringify(doneMap)); } catch (er) {}
      var li = g.closest('li'), ck = G.checks[g.dataset.item]; li.classList.add('done'); li.querySelector('input[data-id]').checked = true;
      li.querySelector('.gtag').textContent = ck.self ? '⚠️ Done without a professional (recorded)' : '✓ Reviewed by ' + ck.reviewer; g.remove();
    });
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-copy]'); if (!b) return;
    var text = D[b.dataset.copy].body.replace(/\*\*/g, '');
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { b.textContent = 'Copied'; }, function () { b.textContent = 'Select and copy below'; });
  });
}

var demo = q.get('demo'), dir = q.get('p');
if (demo && window.SPINUP_PROJECTS && window.SPINUP_PROJECTS[demo]) render(window.SPINUP_PROJECTS[demo]);
else if (dir) Promise.all([fetch('/project-data?p=' + encodeURIComponent(dir)).then(function (r) { return r.json(); }),
    fetch('/guard?p=' + encodeURIComponent(dir)).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })])
  .then(function (x) { GUARD = x[1]; render(x[0]); })
  .catch(function () { document.getElementById('app').innerHTML = '<p class="empty">This project page needs the SpinUp helper running.</p>'; });
else document.getElementById('app').innerHTML = '<p class="empty">No project chosen.</p>';

// Security banner (Tai, 11-05): Chief's security watch paused a Pro or raised an alert on this project. Red, at the top, until cleared.
if (dir && !demo && /^http/.test(location.protocol)) {
  var sec = document.createElement('div'); sec.id = 'secBanner'; sec.className = 'secban'; sec.hidden = true; sec.setAttribute('role', 'alert');
  document.body.insertBefore(sec, document.body.firstChild);
  var secPost = function (u, b) { return fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ p: dir }, b)) }).then(function (r) { return r.json(); }); };
  var secDraw = function (S) {
    var open = (S.alerts || []).filter(function (a) { return a.open; }), paused = Object.keys(S.paused || {});
    sec.hidden = !open.length; if (!open.length) return;
    sec.innerHTML = '<b>🛡️ Security alert</b> · ' + (paused.length ? 'Paused: ' + esc(open.filter(function (a) { return paused.indexOf(a.who) >= 0; }).map(function (a) { return a.name; }).filter(function (v, i, x) { return x.indexOf(v) === i; }).join(', ')) + '. ' : '') +
      '<ul>' + open.slice(0, 4).map(function (a) { return '<li>' + esc(new Date(a.at).toLocaleString()) + ' · ' + esc(a.reasons.join('; ')) + '</li>'; }).join('') + '</ul>' +
      '<div class="secact">' + (paused.length ? paused.map(function (k) { var a = open.filter(function (x) { return x.who === k; })[0]; return '<button type="button" data-sec="resume" data-who="' + esc(k) + '">▶ Resume ' + esc(a ? a.name : k) + '</button>'; }).join('') : '<button type="button" data-sec="resume">✓ Dismiss</button>') +
      '<label><input type="checkbox" data-sec="mode"' + (S.mode === 'alert' ? ' checked' : '') + '> Alert only on this project (don\'t pause)</label></div>';
  };
  window.SU_SECURITY = function () { fetch('/security?p=' + encodeURIComponent(dir)).then(function (r) { return r.json(); }).then(secDraw).catch(function () {}); };
  sec.addEventListener('click', function (e) { var b = e.target.closest('button[data-sec="resume"]'); if (b) secPost('/security/resume', { who: b.dataset.who || '' }).then(secDraw); });
  sec.addEventListener('change', function (e) { if (e.target.dataset.sec === 'mode') secPost('/security/mode', { mode: e.target.checked ? 'alert' : 'pause' }).then(secDraw); });
  window.SU_SECURITY(); setInterval(window.SU_SECURITY, 15000);
}
})();
</script>
<!-- 🐞 Feedback: bottom-left on every SpinUp page, clear of the chat panel and Skip voice (Tai, 11-03).
     Save on this PC (needs the helper), or Post on GitHub: opens a pre-filled public issue the person checks and submits.

<style>

         background:var(--surface, #16213a); color:var(--ink, #e8eefc); border:1px solid var(--line, #2a3a5c); border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.45); font-size:14px; }

</style>
<button type="button" id="fbBtn" title="Report a bug or share an idea">🐞 Feedback</button>
<div id="fbBox" role="dialog" aria-label="Send feedback" hidden>
  <b>🐞 Bug or idea?</b>
  <div class="fbk" role="group" aria-label="What kind">
    <button type="button" data-k="bug" aria-pressed="true">🐞 Bug</button><button type="button" data-k="idea" aria-pressed="false">💡 Idea</button>
    <button type="button" data-k="confusing" aria-pressed="false">🤔 Confusing</button><button type="button" data-k="praise" aria-pressed="false">👍 Works great</button><button type="button" data-k="wrong" aria-pressed="false">⚠️ AI got it wrong</button>
  </div>
  <textarea id="fbText" aria-label="What happened" placeholder="What happened, or what would make this better? (Windows+H to dictate)"></textarea>
  <label><input type="checkbox" id="fbCtx"> <span>Include the last few messages and the project name<br><span class="fbnote">They can hold personal details. Leave this off if so.</span></span></label>
  <span class="fbnote">Post on GitHub opens a public issue for you to check and submit (free GitHub account).<span id="fbLocalNote"> Save on this PC keeps it here.</span></span>
  <div class="fbrow"><button type="button" id="fbCancel">Cancel</button><button type="button" id="fbSave">Save on this PC</button><button type="button" class="primary" id="fbGit">Post on GitHub ↗</button>
    <span class="fbmsg" id="fbMsg" aria-live="polite"></span></div>
</div>
<script>
(function () {
  var REPO = 'https://github.com/c4rm4boy/spinup', VERSION = 'v0.9.13';
  var btn = document.getElementById('fbBtn'), box = document.getElementById('fbBox'), ta = document.getElementById('fbText'), msg = document.getElementById('fbMsg');
  var ctxBox = document.getElementById('fbCtx'), saveB = document.getElementById('fbSave'), kind = 'bug', HELPER = false;
  var BASE = location.protocol === 'http:' ? '' : 'http://127.0.0.1:8787';
  // Save on this PC only where the helper is running; GitHub works everywhere, the public demo included.
  saveB.hidden = true; document.getElementById('fbLocalNote').hidden = true;
  if (location.protocol !== 'https:') fetch(BASE + '/health').then(function (r) { if (r.ok) { HELPER = true; saveB.hidden = false; document.getElementById('fbLocalNote').hidden = false; } }).catch(function () {});
  var open = function (on) { box.hidden = !on; if (on) { msg.textContent = ''; ta.focus(); } };
  btn.onclick = function () { open(box.hidden); };
  document.getElementById('fbCancel').onclick = function () { open(false); };
  box.querySelector('.fbk').onclick = function (e) { var b = e.target.closest('[data-k]'); if (!b) return; kind = b.dataset.k;
    box.querySelectorAll('[data-k]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !box.hidden) { e.stopPropagation(); open(false); } }, true);
  // What was on screen: the last few lines of the conversation or the open chat, and which project.
  var context = function () {
    return [].slice.call(document.querySelectorAll('#log .msg, #msgs .m')).slice(-8).map(function (m) {
      var who = m.querySelector('.who'); return (who ? who.textContent.split('·')[0].trim() + ': ' : (m.classList.contains('me') || m.classList.contains('you') ? 'You: ' : '')) +
        (m.querySelector('.txt') || m).textContent.replace(/\s+/g, ' ').trim().slice(0, 280); });
  };
  var project = function () {
    var p = new URLSearchParams(location.search).get('p'); if (p) return p;
    var bt = document.getElementById('briefText'); if (bt && bt.textContent.trim()) return bt.textContent.trim();
    var a = document.getElementById('askInput'); return a && a.value ? a.value : '';
  };
  // Which page, without the page title (a project's title is its goal, which can be personal).
  var where = function () {
    var f = location.pathname.split('/').pop() || 'index.html';
    return /SpinUp Home|Chief/i.test(decodeURIComponent(f)) ? 'SpinUp Home' : /^project\.html/.test(f) ? 'Project page' : /^SpinUp\.html/.test(f) ? 'Start page' :
      location.protocol === 'https:' ? 'Public demo' : decodeURIComponent(f);
  };
  var browser = function () { var u = navigator.userAgent, m = u.match(/Edg\/(\d+)/) || u.match(/Chrome\/(\d+)/) || u.match(/Firefox\/(\d+)/) || u.match(/Version\/(\d+).*Safari/);
    return (/Edg\//.test(u) ? 'Edge ' : /Chrome\//.test(u) ? 'Chrome ' : /Firefox\//.test(u) ? 'Firefox ' : /Safari\//.test(u) ? 'Safari ' : '') + (m ? m[1] : '') + (/Mobi/.test(u) ? ' (phone)' : ''); };
  var KIND = { bug: ['Bug', 'bug'], idea: ['Idea', 'enhancement'], confusing: ['Confusing', 'question'], praise: ['Works great', ''], wrong: ['AI got it wrong', ''] };
  var saveLocal = function () {
    return fetch(BASE + '/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, text: ta.value.trim(), page: document.title, project: project(), version: VERSION, context: context() }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); }); });
  };
  saveB.onclick = function () {
    if (!ta.value.trim()) { ta.focus(); return; }
    saveB.disabled = true; msg.textContent = 'Saving…';
    saveLocal().then(function () { ta.value = ''; msg.textContent = 'Thanks, it\'s saved on this PC.'; setTimeout(function () { open(false); }, 1400); })
      .catch(function (e) { msg.textContent = e.message && e.message !== 'Failed to fetch' ? e.message : 'The SpinUp helper isn\'t running, so it couldn\'t be saved.'; })
      .then(function () { saveB.disabled = false; });
  };
  document.getElementById('fbGit').onclick = function () {
    var text = ta.value.trim(); if (!text) { ta.focus(); return; }
    var k = KIND[kind], withCtx = ctxBox.checked, lines = withCtx ? context() : [];
    var body = '**' + k[0] + '**\n\n' + text + '\n\n---\n' +
      '- Where: ' + where() + '\n- Version: ' + VERSION + '\n- Browser: ' + browser() + '\n' +
      (withCtx && project() ? '- Project: ' + project() + '\n' : '') +
      (lines.length ? '\n<details><summary>Last messages</summary>\n\n' + lines.map(function (l) { return '> ' + l; }).join('\n>\n') + '\n</details>\n' : '') +
      '\n_Sent from the 🐞 Feedback button in SpinUp._';
    var title = '[' + k[0] + '] ' + text.replace(/\s+/g, ' ').slice(0, 70) + (text.length > 70 ? '…' : '');
    var url = REPO + '/issues/new?title=' + encodeURIComponent(title) + (k[1] ? '&labels=' + k[1] : '') + '&body=' + encodeURIComponent(body.slice(0, 6000));
    if (HELPER) saveLocal().catch(function () {});   // keep a local copy too
    window.open(url, '_blank', 'noopener');
    msg.textContent = 'GitHub opened in a new tab. Check it, then press Submit new issue.';
  };
})();
</script>
