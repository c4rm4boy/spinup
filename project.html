<!-- SpinUp project home page (Tai Nguyen, 2026). One page per idea once "Put your Staff to work" runs: your Staff as agents,
     today's tasks (yours vs theirs), each Pro's first deliverable, a timeline, decisions and what the Staff knows.
     Data: ?demo=<slug> reads data.js (static demo); ?p=<project> fetches /project-data from the SpinUp helper. -->
<style>
/* A home page for one idea: summary tiles up top, then a section per tile. Dark by default. */
:root {
  --bg:#0e1522; --surface:#162033; --surface-2:#1c2840; --ink:#e8edf6; --ink-2:#b8c3d6; --muted:#8a97ad; --line:#2a3752; --focus:#7aa5ff;
  --accent:#3fd1c7; --lead:#f2c94c; --good:#6fd38c; --you:#7aa5ff;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif; --f-body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--f-body); }
.wrap { max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:24px 56px; display:grid; gap:22px; }
button { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:5px 12px; cursor:pointer; }
button:hover { border-color:var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
a { color:var(--focus); }
.eyebrow { margin:0; font:700 13px var(--f-display); letter-spacing:.14em; text-transform:uppercase; color:var(--lead); }
.eyebrow span { color:var(--muted); }
h1 { margin:4px 0 0; font:750 clamp(28px,5vw,42px)/1.08 var(--f-display); text-wrap:balance; }
.one { margin:6px 0 0; color:var(--ink-2); font-size:18px; max-width:70ch; }
.meta { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-top:10px; color:var(--muted); font-size:14px; }
.pill { display:inline-flex; gap:6px; align-items:center; padding:3px 10px; border-radius:999px; background:color-mix(in srgb, var(--good) 16%, transparent); color:var(--good); font:650 13px var(--f-display); }
.pill::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--good); box-shadow:0 0 8px var(--good); }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr)); gap:10px; }
.tile { display:grid; gap:2px; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:12px; padding:12px 14px; }
.tile:hover { border-color:var(--c); }
.tile b { font:700 26px/1.1 var(--f-display); font-variant-numeric:tabular-nums; }
.tile span { color:var(--ink-2); font-size:14px; }
section { display:grid; gap:12px; scroll-margin-top:12px; }
/* Grid items default to min-width:auto, which lets the wide timeline push the whole page sideways on a phone. */
.wrap > *, section > *, .grid > *, .cols > * { min-width:0; }
.agent .ti, .deliv h3, .todo .t { overflow-wrap:anywhere; }
h2 { margin:0; font:700 21px var(--f-display); display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
h2 small { font:400 14px var(--f-body); color:var(--muted); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr)); gap:12px; align-items:start; }
.agent { background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:12px; padding:12px 14px; display:grid; gap:8px; }
.agent .top { display:grid; grid-template-columns:40px 1fr auto; gap:10px; align-items:center; }
.agent .av { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-size:21px; background:var(--surface-2); border:2px solid var(--c); }
.agent .nm { font:650 16px/1.2 var(--f-display); }
.agent .ti { color:var(--ink-2); font-size:13.5px; }
.badge { font:700 11px var(--f-display); letter-spacing:.08em; padding:3px 8px; border-radius:999px; color:#06231f; background:var(--accent); }
.status { font-size:14.5px; }
.status b { color:var(--accent); }
.agent dl { margin:0; display:grid; gap:6px; font-size:14px; }
.agent dt { font:650 12.5px var(--f-display); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.agent dd { margin:0; color:var(--ink-2); }
.agent dd ul { margin:2px 0 0; padding-left:18px; }
details > summary { cursor:pointer; color:var(--ink-2); font-size:14px; }
.cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:12px; }
.box { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:8px; align-content:start; }
.box h3 { margin:0; font:650 16.5px var(--f-display); }
.todo { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.todo li { display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:start; padding:6px 8px; border-radius:8px; background:var(--surface-2); }
.todo input { width:18px; height:18px; margin-top:2px; accent-color:var(--accent); }
.todo li.done span.t { text-decoration:line-through; color:var(--muted); }
/* The Staff's finished work isn't crossed out; it's delivered. */
.todo li.delivered > span:first-child { color:var(--good); font-weight:700; }
.todo li.delivered .when { color:var(--good); }
.todo .when { color:var(--muted); font-size:13px; white-space:nowrap; }
.todo .who { font-size:13px; color:var(--c); font-weight:650; }
.deliv { background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:12px; padding:12px 14px; display:grid; gap:8px; align-content:start; }
.deliv .hd { display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.deliv .kind { font:700 11px var(--f-display); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.deliv h3 { margin:0; font:650 17px var(--f-display); }
.deliv .sum { margin:0; color:var(--ink-2); font-size:14.5px; }
.md { font-size:14.5px; border-top:1px solid var(--line); padding-top:8px; }
.md h4 { margin:10px 0 4px; font:650 15px var(--f-display); }
.md p { margin:6px 0; } .md ul { margin:4px 0; padding-left:20px; }
.md table { border-collapse:collapse; font-size:13.5px; margin:6px 0; } .md td, .md th { border-bottom:1px solid var(--line); padding:4px 10px 4px 0; text-align:left; }
.tablewrap { overflow-x:auto; }
.gantt { display:grid; gap:6px; overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.grow { display:grid; grid-template-columns:200px 1fr; gap:10px; align-items:center; min-width:640px; }
.grow .lbl { font-size:14px; } .grow .lbl small { display:block; color:var(--muted); font-size:12.5px; }
.track { position:relative; height:24px; background:repeating-linear-gradient(90deg, transparent 0, transparent calc(100% / var(--w) - 1px), var(--line) calc(100% / var(--w) - 1px), var(--line) calc(100% / var(--w))); border-radius:6px; }
.bar { position:absolute; top:3px; bottom:3px; border-radius:6px; background:var(--c); opacity:.9; }
.axis { color:var(--muted); font-size:12.5px; }
.facts { display:flex; flex-wrap:wrap; gap:6px; }
.facts span { font-size:14px; padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); }
.decisions { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.decisions li { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
.decisions li span { color:var(--ink-2); font-size:14.5px; }
.grew { color:var(--ink-2); font-size:14.5px; }
.guard { border:1px dashed var(--good); border-radius:12px; padding:10px 14px; color:var(--ink-2); font-size:14.5px; }
.guard b { color:var(--good); }
.foot { color:var(--muted); font-size:13.5px; margin:0; }
.empty { color:var(--muted); }
/* Talk to your Staff: a chat drawer with a tab per Pro, each tab a real Claude Code session (needs the SpinUp helper). */
.talk { justify-self:start; font-size:14px; }
.agent .talk { margin-top:2px; }
#chat { position:fixed; top:0; right:0; bottom:0; width:min(480px,100vw); z-index:20; display:grid; grid-template-rows:auto auto 1fr auto; background:var(--surface); border-left:1px solid var(--line); box-shadow:-12px 0 32px rgba(0,0,0,.35); padding-top:env(safe-area-inset-top,0px); }
#chat[hidden] { display:none; }
/* Real people (step 13a) and the timeline review */
.realbar { display:flex; gap:8px; flex-wrap:wrap; }
.agent.real { border-left-style:solid; }
.badge.real { background:#e8916b; color:#2a1206; }
.contact { font-size:14px; color:var(--ink-2); } .private { font-size:11.5px; color:var(--muted); }
.hlog { margin:4px 0 0; padding-left:18px; font-size:13.5px; color:var(--ink-2); }
.hact { display:flex; gap:6px; flex-wrap:wrap; } .hact button { font-size:13px; padding:3px 9px; } .hact .del, .hconfirm .del { color:#ff8a7a; }
.hconfirm, .hlogform { display:grid; gap:6px; font-size:13.5px; border-top:1px dashed var(--line); padding-top:8px; }
.hlogform input, .hlogform select, .hform input, .hform select, .hform textarea { font:inherit; font-size:14px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:6px 8px; width:100%; }
.hform { display:grid; gap:10px; max-width:640px; } .hform label { display:grid; gap:3px; font-size:13px; color:var(--ink-2); }
.fgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap:10px; }
.hform .row, .tlr .row, .hlogform .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; } .hform .err { color:#ff8a7a; font-size:13.5px; }
button.primary { background:var(--accent); color:#06231f; border-color:var(--accent); font-weight:650; }
.needs { display:grid; gap:6px; background:var(--surface); border:1px dashed #e8916b; border-radius:12px; padding:10px 12px; font-size:14px; }
.need { display:flex; gap:10px; align-items:center; justify-content:space-between; } .need i { color:var(--muted); }
.tlr { display:grid; gap:8px; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--lead); border-radius:12px; padding:12px 14px; font-size:14.5px; }
.tlr ul { margin:0; padding-left:18px; } .tlr .err { color:#ff8a7a; }
.tlbtn { margin-left:auto; font:inherit; font-size:13.5px; }
.sched { margin:6px 0 0; color:var(--ink-2); font-size:15px; } .sched b { color:var(--lead); }
/* 🔊 read aloud and ✏️ rename (Tai, 11-02) */
.say { font-size:13px; min-height:28px; padding:2px 10px; }
.say.on { border-color:var(--accent); color:var(--accent); }
.say.mini { display:block; margin:6px 0 0 auto; padding:1px 8px; font-size:12.5px; background:transparent; }
.hdb { display:flex; gap:6px; align-items:center; }
.ren { background:none; border:0; padding:0 4px; font-size:13px; cursor:pointer; opacity:.6; }
.ren:hover, .ren:focus-visible { opacity:1; }
.renbox { display:inline-flex; flex-wrap:wrap; gap:4px; align-items:center; margin-left:4px; }
.renbox input { font:inherit; font-size:14px; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:2px 6px; width:11em; }
.renbox button { font-size:13px; padding:2px 8px; }
.renbox .err { color:#ff8a7a; font-size:12.5px; }
/* Video highlight: the Talk buttons and the chat panel glow so viewers see they can keep talking to each Pro. */
.talk.hl { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 22%, var(--surface)); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent); }
#chat.hl { border-left:2px solid var(--accent); box-shadow:-12px 0 32px rgba(0,0,0,.35), inset 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
#chat .chd { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
#chat .chd b { flex:1; font:650 16px var(--f-display); }
#chat .tabs { display:flex; gap:6px; padding:8px 10px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line); }
#chat .tabs button { white-space:nowrap; border-radius:999px; padding:4px 10px; font-size:13.5px; }
#chat .tabs button[aria-selected="true"] { border-color:var(--c); background:color-mix(in srgb, var(--c) 18%, var(--surface)); }
#chat .msgs { overflow-y:auto; padding:12px 14px; display:grid; gap:10px; align-content:start; }
#chat .m { max-width:88%; padding:8px 12px; border-radius:14px; font-size:15px; }
#chat .m.you { justify-self:end; background:#24407a; border-radius:14px 4px 14px 14px; white-space:pre-wrap; }
#chat .m.pro { justify-self:start; background:var(--surface-2); border-left:3px solid var(--c); border-radius:4px 14px 14px 14px; }
#chat .m.pro p { margin:4px 0; } #chat .m.pro ul { margin:4px 0; padding-left:20px; }
#chat .m.err { justify-self:center; color:#ff9f8a; font-size:14px; background:none; }
#chat .act { margin-top:8px; padding:8px 10px; border:1px dashed var(--c); border-radius:10px; background:var(--bg); }
#chat .act ul { margin:4px 0 8px; padding-left:20px; }
#chat .act .actbtns { display:inline-flex; gap:6px; }
#chat .act .actdone { color:var(--muted); font-size:13.5px; }
#chat .act .err { display:block; color:#ff8a7a; font-size:12.5px; }
#chat .wait { color:var(--muted); font-size:14px; }
#chat .files { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 6px; }
#chat .files button { font-size:13px; padding:3px 9px; }
#chat form { display:grid; grid-template-columns:1fr auto; gap:8px; padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); }
#chat textarea { font:inherit; color:var(--ink); background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; resize:none; min-height:44px; max-height:140px; }
#chat .hint { grid-column:1/-1; color:var(--muted); font-size:12.5px; }
#doc { position:fixed; inset:0; z-index:30; background:rgba(5,10,20,.7); display:grid; place-items:center; padding:16px; }
#doc .sheet { width:min(820px,100%); max-height:88vh; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 20px; }
#doc .sheet .top { display:flex; justify-content:space-between; gap:10px; align-items:center; }
</style>

<script>
(function () {
'use strict';
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var q = new URLSearchParams(location.search);

// Small, safe Markdown: everything is escaped first, then headings, bullets, tables and bold are formatted.
function md(src) {
  var lines = esc(src).split('\n'), out = '', list = false, table = [];
  function flushTable() {
    if (!table.length) return;
    var rows = table.filter(function (r) { return !/^\s*\|?[\s:|-]+\|?\s*$/.test(r); });
    out += '<div class="tablewrap"><table>' + rows.map(function (r, i) {
      var cells = r.trim().replace(/^\||\|$/g, '').split('|');
      return '<tr>' + cells.map(function (c) { return i === 0 ? '<th>' + c.trim() + '</th>' : '<td>' + c.trim() + '</td>'; }).join('') + '</tr>';
    }).join('') + '</table></div>';
    table = [];
  }
  lines.forEach(function (l) {
    if (/^\s*\|/.test(l)) { if (list) { out += '</ul>'; list = false; } table.push(l); return; }
    flushTable();
    var h = l.match(/^#{1,6}\s+(.*)/), b = l.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)/);
    if (h) { if (list) { out += '</ul>'; list = false; } out += '<h4>' + h[1] + '</h4>'; }
    else if (b) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + b[1] + '</li>'; }
    else if (!l.trim()) { if (list) { out += '</ul>'; list = false; } }
    else { if (list) { out += '</ul>'; list = false; } out += '<p>' + l + '</p>'; }
  });
  flushTable(); if (list) out += '</ul>';
  return out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
// ---------- Read aloud (Tai, 11-02): the browser's own text-to-speech, so any text can be spoken ----------
// Natural voices only (never the robotic desktop ones); each person keeps one voice; 🔊 again stops.
var synth = window.speechSynthesis || null, VMAP = {}, SAYING = null;
var VLIST = { female: ['Ava', 'Emma', 'Aria', 'Sonia', 'Libby', 'Natasha', 'Jenny', 'Samantha', 'Google UK English Female', 'Google US English'],
              male: ['Andrew', 'Brian', 'Christopher', 'Guy', 'Eric', 'Roger', 'Steffan', 'Ryan', 'William', 'Daniel', 'Google UK English Male'] };
function goodVoices() { return synth ? synth.getVoices().filter(function (v) { return /^en/i.test(v.lang) && /Natural|Google|Samantha|Daniel/i.test(v.name); }) : []; }
function voiceFor(key, gender) {
  if (VMAP[key]) return VMAP[key];
  var pool = goodVoices(); if (!pool.length) return null;
  var used = Object.keys(VMAP).map(function (k) { return VMAP[k]; }), names = VLIST[gender] || VLIST.female;
  for (var i = 0; i < names.length; i++) { var hit = pool.filter(function (v) { return v.name.indexOf(names[i]) >= 0 && used.indexOf(v) < 0; })[0]; if (hit) return (VMAP[key] = hit); }
  return (VMAP[key] = pool.filter(function (v) { return used.indexOf(v) < 0; })[0] || pool[0]);
}
if (synth) synth.addEventListener && synth.addEventListener('voiceschanged', function () {});
// Markdown → something worth hearing: tables and symbols are skipped, bullets become sentences.
function plainForSpeech(src) {
  return String(src || '').split('\n').filter(function (l) { return !/^\s*\|/.test(l); }).map(function (l) {
    return l.replace(/^#{1,6}\s+/, '').replace(/^\s*(?:[-*]|\d+[.)])\s+/, '').replace(/\*\*|__|`/g, '').trim();
  }).filter(Boolean).map(function (l) { return /[.!?:]$/.test(l) ? l : l + '.'; }).join(' ');
}
function stopSaying() { if (synth) synth.cancel(); if (SAYING) { SAYING.classList.remove('on'); SAYING.textContent = SAYING.dataset.label || '🔊'; } SAYING = null; }
function say(btn, text, key, gender) {
  if (!synth) { btn.title = 'This browser can\'t read aloud. Try Microsoft Edge.'; return; }
  var again = SAYING === btn; stopSaying(); if (again) return;
  SAYING = btn; btn.dataset.label = btn.dataset.label || btn.textContent; btn.classList.add('on'); btn.textContent = '■ Stop';
  // Speak in short pieces: long single utterances can stall in some browsers.

  parts.forEach(function (p, i) {

    if (i === parts.length - 1) u.onend = u.onerror = function () { if (SAYING === btn) stopSaying(); };
    synth.speak(u);
  });
}
var KIND = { checklist: 'Checklist', email: 'Email draft', budget: 'Budget', research: 'Research', comparison: 'Comparison', script: 'Script' };

function render(P) {
  var M = P.manifest || {}, people = P.people || {}, cast = (P.cast || []).filter(function (k) { return people[k]; }), D = P.deliverables || {};
  var lead = people.lead || { name: P.lead || 'Your Lead', emoji: '🧭', color: 'var(--lead)' };
  // Chat only works on a real project opened through the SpinUp helper (not the static demo).
  var LIVE = !!(P.dir && /^http/.test(location.protocol) && !q.get('demo'));
  // In the video (&film=1) the chat shows real recorded exchanges (P.chats) and the video drives it through window.FILMCHAT.
  var FILMCHAT = !!q.get('film') && !!P.chats, TALK = LIVE || FILMCHAT;
  // Real people on the project (step 13a) and the Lead's suggestions for who's needed.
  var REAL = P.realPros || [], NEED = P.needsHuman || [];
  var human = function (k) { return REAL.filter(function (h) { return h.id === k; })[0]; };
  var pc = function (k) { return (people[k] && people[k].color) || (human(k) ? '#e8916b' : 'var(--you)'); };
  var nm = function (k) { return k === 'you' ? 'You' : k === 'lead' ? lead.name.split(' ')[0] : people[k] ? people[k].name : human(k) ? '👤 ' + human(k).name : k; };
  document.title = '🚀 ' + (M.title || P.request || 'SpinUp project');
  var storeKey = 'spinup-todo-' + (P.dir || P.slug || M.title);
  var doneMap = {}; try { doneMap = JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch (e) {}
  if (P.done) Object.keys(P.done).forEach(function (k) { if (P.done[k]) doneMap[k] = true; });   // ticks saved on the PC (Chief and Telegram see these)
  var delivs = cast.filter(function (k) { return D[k]; });
  var emails = delivs.filter(function (k) { return ((M.agents || {})[k] || {}).first && M.agents[k].first.kind === 'email'; });
  var weeks = Math.max.apply(null, (M.timeline || []).map(function (p) { return p.start + p.weeks - 1; }).concat([4]));

      }, function (er) { o.querySelector('.err').textContent = er.message; });
    });
  }
  // Adding a real person usually moves the schedule (availability, lead times), so offer the Lead's review (Tai, 11-03).
  function offerReview(reason, headline) {
    var box = document.getElementById('tlreview');
    box.innerHTML = '<div class="tlr"><b>' + esc(headline || 'Timeline check') + '</b> Real people can change the schedule: their availability, lead times and when they can meet. ' +
      '<div class="row"><button type="button" class="primary" data-tl="go">🔄 Ask ' + esc(LEADFIRST) + ' to review the timeline</button><button type="button" data-tl="later">Not now</button></div></div>';
    box.dataset.reason = reason; box.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  function runReview(reason) {
    var box = document.getElementById('tlreview'); box.dataset.reason = reason;
    box.innerHTML = '<div class="tlr"><span class="wait">🔄 ' + esc(LEADFIRST) + ' is reviewing the timeline…</span></div>'; box.scrollIntoView({ block: 'center', behavior: 'smooth' });
    api('/project/timeline-review', { p: P.dir, reason: reason }).then(function (j) {
      var r = j.review, diff = r.endWeeks - r.beforeWeeks;
      box.innerHTML = '<div class="tlr"><b>' + esc(lead.emoji || '') + ' ' + esc(LEADFIRST) + ':</b> ' + esc(r.leadSays) +
        (r.changes.length ? '<ul>' + r.changes.map(function (c) { return '<li><b>' + esc(c.phase) + ':</b> ' + esc(c.why) + '</li>'; }).join('') + '</ul>' : '') +
        '<p class="note">' + (r.fits && !r.changes.length ? 'The timeline still fits.' : 'New end: week ' + r.endWeeks + (diff ? ' (' + (diff > 0 ? '+' : '') + diff + ' weeks)' : ' (no change to the end date)')) + '</p>' +
        (r.changes.length ? '<div class="row"><button type="button" class="primary" data-tl="apply">Apply the new timeline</button><button type="button" data-tl="keep">Keep the current one</button></div>'
          : '<div class="row"><button type="button" data-tl="keep">OK</button></div>') + '</div>';
    }, function (er) { box.innerHTML = '<div class="tlr"><span class="err">' + esc(er.message) + '</span></div>'; });
  }
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tl]');
    if (t) {
      var act = t.dataset.tl, box = document.getElementById('tlreview');
      if (act === 'review') runReview('The person asked for a timeline check');
      else if (act === 'go') runReview(box.dataset.reason || 'A check-in');
      else if (act === 'apply') api('/project/timeline-apply', { p: P.dir }).then(function () { location.reload(); }, function (er) { alert(er.message); });
      else location.reload();
      return;
    }
    var b = e.target.closest('[data-human]');
    if (b) {
      if (b.dataset.human === 'add') humanForm();
      else if (b.dataset.human === 'addfrom') humanForm(null, { role: b.dataset.role, relation: b.dataset.rel });
      else if (b.dataset.human === 'suggest') {
        b.disabled = true; b.textContent = '💡 ' + LEADFIRST + ' is thinking…';
        api('/project/human-suggestions', { p: P.dir }).then(function (j) { NEED = j.needs; document.getElementById('needs').innerHTML = needsHtml(NEED); b.disabled = false; b.textContent = '💡 Who do I need?'; },
          function (er) { b.disabled = false; b.textContent = '💡 Who do I need?'; alert(er.message); });
      }
      return;
    }
    var a = e.target.closest('[data-hact]'); if (!a) return;
    var card = a.closest('[data-hid]'), h = human(card.dataset.hid);
    if (a.dataset.hact === 'edit') humanForm(h);
    else if (a.dataset.hact === 'prep') {
      // The Lead drafts the agenda and questions in its chat tab.
      chatOpen('lead');
      var ta = document.getElementById('chatT');
      ta.value = 'Help me prepare for my meeting with ' + h.name + ' (' + h.role + (h.company ? ', ' + h.company : '') + '): a short agenda, the questions I should ask, and what to bring.' + (h.next ? ' The meeting: ' + h.next + '.' : '');
      ta.focus();
    } else if (a.dataset.hact === 'remove' && !card.querySelector('.hconfirm')) {
      card.insertAdjacentHTML('beforeend', '<div class="hconfirm">Remove ' + esc(h.name) + ' from this project, with their log? <button type="button" class="del" data-hrm>Remove</button> <button type="button" data-hno>Cancel</button></div>');
      card.querySelector('[data-hno]').onclick = function () { card.querySelector('.hconfirm').remove(); };
      card.querySelector('[data-hrm]').onclick = function () { api('/project/humans', { p: P.dir, op: 'remove', id: h.id }).then(function () { location.reload(); }); };
    } else if (a.dataset.hact === 'log' && !card.querySelector('.hlogform')) {
      card.insertAdjacentHTML('beforeend', '<div class="hlogform"><select aria-label="What happened">' + ['meeting', 'advice', 'document', 'cost', 'note'].map(function (k) { return '<option>' + k + '</option>'; }).join('') + '</select>' +
        '<input type="text" placeholder="What happened? e.g. Met for coffee; she said apply to 12 schools" aria-label="What happened"><input type="text" placeholder="Next touchpoint (optional)" aria-label="Next touchpoint" value="' + esc(h.next || '') + '">' +
        '<div class="row"><button type="button" class="primary" data-lsave>Save to log</button><button type="button" data-lno>Cancel</button></div></div>');
      var lf = card.querySelector('.hlogform'); lf.querySelector('input').focus();
      lf.querySelector('[data-lno]').onclick = function () { lf.remove(); };
      lf.querySelector('[data-lsave]').onclick = function () {
        var ins = lf.querySelectorAll('input');
        api('/project/humans', { p: P.dir, op: 'log', id: h.id, entry: { kind: lf.querySelector('select').value, text: ins[0].value, next: ins[1].value } }).then(function () { location.reload(); }, function (er) { alert(er.message); });
      };
    }
  });

  // ✏️ Rename a Pro or the Lead (live projects only). Their instructions are rebuilt from the project on every message,
  // so the new name takes effect from their next reply.
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ren]'); if (!b || b.dataset.busy) return;
    var who = b.dataset.ren, cur = proOf(who).name;
    var f = document.createElement('span'); f.className = 'renbox';
    f.innerHTML = '<input type="text" maxlength="30" aria-label="New name" value="' + esc(cur) + '"><button type="button" data-ok>Save</button><button type="button" data-no>Cancel</button><span class="err"></span>';
    b.dataset.busy = '1'; b.hidden = true; b.parentNode.insertBefore(f, b.nextSibling);
    var inp = f.querySelector('input'); inp.focus(); inp.select();
    var close = function () { f.remove(); b.hidden = false; delete b.dataset.busy; };
    f.querySelector('[data-no]').onclick = close;
    var save = function () {
      var name = inp.value.trim(); if (!name || name === cur) return close();
      fetch('/project/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: P.dir, who: who, name: name }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); location.reload(); }); })
        .catch(function (er) { f.querySelector('.err').textContent = er.message || 'Couldn\'t rename just now.'; });
    };
    f.querySelector('[data-ok]').onclick = save;
    inp.onkeydown = function (ev) { if (ev.key === 'Enter') save(); if (ev.key === 'Escape') close(); };
  });
  // Apply / Not now on the Lead's proposed Staff change (the chat panel sits outside #app).
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-apply],[data-decline]'); if (!b || b.disabled) return;
    var card = b.closest('.act'), decline = !!b.dataset.decline;
    card.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
    fetch('/project/staff-apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: P.dir, at: b.dataset.apply || b.dataset.decline, decline: decline }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); })
      .then(function () {
        if (!decline) { location.reload(); return; }
        card.querySelector('.actbtns').outerHTML = '<span class="actdone">Not applied</span>';
      })
      .catch(function (er) { card.querySelectorAll('button').forEach(function (x) { x.disabled = false; }); card.querySelector('.err').textContent = er.message || 'Couldn\'t apply it just now.'; });
  });
  if (FILMCHAT) window.FILMCHAT = {
    glow: function (on) { document.querySelectorAll('.talk').forEach(function (b) { b.classList.toggle('hl', on); }); },
    open: function (who) { chatOpen(who); document.getElementById('chat').classList.add('hl'); },
    tab: function (who) { chatTab(who); }
  };

  app.addEventListener('change', function (e) {
    var c = e.target.closest('input[data-id]'); if (!c) return;
    doneMap[c.dataset.id] = c.checked; c.closest('li').classList.toggle('done', c.checked);
    try { localStorage.setItem(storeKey, JSON.stringify(doneMap)); } catch (er) {}
    if (LIVE) fetch('/project/ticks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ p: P.dir, done: doneMap }) }).catch(function () {});
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-copy]'); if (!b) return;
    var text = D[b.dataset.copy].body.replace(/\*\*/g, '');
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { b.textContent = 'Copied'; }, function () { b.textContent = 'Select and copy below'; });
  });
}

var demo = q.get('demo'), dir = q.get('p');
if (demo && window.SPINUP_PROJECTS && window.SPINUP_PROJECTS[demo]) render(window.SPINUP_PROJECTS[demo]);
else if (dir) fetch('/project-data?p=' + encodeURIComponent(dir)).then(function (r) { return r.json(); }).then(render)
  .catch(function () { document.getElementById('app').innerHTML = '<p class="empty">This project page needs the SpinUp helper running.</p>'; });
else document.getElementById('app').innerHTML = '<p class="empty">No project chosen.</p>';
})();
</script>
</body>
